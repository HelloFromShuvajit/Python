<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scam Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .content {
            padding: 40px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #667eea;
        }

        .button-container {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .clear-btn {
            background: #6c757d;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading.active {
            display: block;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            animation: fadeIn 0.5s ease-in;
        }

        .result.active {
            display: block;
        }

        .result.scam {
            background: #fee;
            border: 2px solid #e74c3c;
        }

        .result.legitimate {
            background: #efe;
            border: 2px solid #27ae60;
        }

        .result.suspicious {
            background: #fff3cd;
            border: 2px solid #ffc107;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .result.scam .result-header {
            color: #c0392b;
        }

        .result.legitimate .result-header {
            color: #229954;
        }

        .result.suspicious .result-header {
            color: #d68910;
        }

        .result-content {
            color: #333;
            line-height: 1.8;
            white-space: pre-wrap;
            font-size: 15px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .examples {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .examples h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .example-btn {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Scam Detector</h1>
            <p>AI-powered scam and phishing detection</p>
        </div>

        <div class="content">
            <div class="input-section">
                <label for="messageInput">Enter the message to analyze:</label>
                <textarea 
                    id="messageInput" 
                    placeholder="Paste the suspicious email, SMS, or message here...&#10;&#10;Example:&#10;&quot;URGENT: Your bank account has been suspended. Click here immediately to verify your identity and restore access: http://suspicious-link.com&quot;"
                ></textarea>
            </div>

            <div class="button-container">
                <button id="analyzeBtn">🔍 Analyze Message</button>
                <button id="clearBtn" class="clear-btn">Clear</button>
            </div>

            <div class="examples">
                <h3>Try these examples:</h3>
                <span class="example-btn" data-example="URGENT: Your package delivery failed! Click here NOW to reschedule or your package will be returned: bit.ly/pkg123">📦 Delivery Scam</span>
                <span class="example-btn" data-example="Congratulations! You've won $1,000,000 in our lottery! Reply with your bank details to claim your prize immediately!">💰 Prize Scam</span>
                <span class="example-btn" data-example="Hi, this is a reminder that your dentist appointment is scheduled for tomorrow at 2 PM. Reply CONFIRM or CANCEL.">🦷 Legitimate Message</span>
            </div>

            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p>Analyzing message...</p>
            </div>

            <div class="error" id="errorMessage"></div>

            <div class="result" id="result">
                <div class="result-header" id="resultHeader"></div>
                <div class="result-content" id="resultContent"></div>
            </div>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('messageInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const result = document.getElementById('result');
        const resultHeader = document.getElementById('resultHeader');
        const resultContent = document.getElementById('resultContent');

        const API_URL = 'http://127.0.0.1:8000/check-scam';

        // Example buttons
        document.querySelectorAll('.example-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                messageInput.value = btn.dataset.example;
                messageInput.focus();
            });
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
            setTimeout(() => {
                errorMessage.classList.remove('active');
            }, 5000);
        }

        function hideResult() {
            result.classList.remove('active', 'scam', 'legitimate', 'suspicious');
        }

        function showResult(analysis) {
            // Determine verdict type from response
            let verdictType = 'suspicious';
            let icon = '⚠️';
            
            const analysisLower = analysis.toLowerCase();
            
            if (analysisLower.includes('verdict: scam') || analysisLower.includes('verdict:scam')) {
                verdictType = 'scam';
                icon = '🚨';
            } else if (analysisLower.includes('verdict: legitimate') || analysisLower.includes('verdict:legitimate')) {
                verdictType = 'legitimate';
                icon = '✅';
            } else if (analysisLower.includes('verdict: suspicious') || analysisLower.includes('verdict:suspicious')) {
                verdictType = 'suspicious';
                icon = '⚠️';
            }

            result.className = `result active ${verdictType}`;
            resultHeader.textContent = `${icon} Analysis Results`;
            resultContent.textContent = analysis;
        }

        async function analyzeMessage() {
            const message = messageInput.value.trim();
            
            if (!message) {
                showError('Please enter a message to analyze.');
                return;
            }

            hideResult();
            errorMessage.classList.remove('active');
            analyzeBtn.disabled = true;
            loading.classList.add('active');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    showResult(data.analysis);
                } else {
                    showError(data.error || 'Failed to analyze message.');
                }

            } catch (error) {
                console.error('Error:', error);
                showError('Failed to connect to the server. Make sure the API is running.');
            } finally {
                loading.classList.remove('active');
                analyzeBtn.disabled = false;
            }
        }

        function clearForm() {
            messageInput.value = '';
            hideResult();
            errorMessage.classList.remove('active');
            messageInput.focus();
        }

        analyzeBtn.addEventListener('click', analyzeMessage);
        clearBtn.addEventListener('click', clearForm);

        messageInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                analyzeMessage();
            }
        });

        messageInput.focus();
    </script>
</body>
</html>
